[project]
name = "workfleet"
version = "0.1.0"
description = "Agent workflow sample"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
workfleet = "workfleet:main"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["workfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.importlinter]
root_package = "workfleet"

[[tool.importlinter.contracts]]
id = "clean-architecture"
name = "Clean architecture layers"
type = "layers"
containers = ["workfleet"]
layers = [
    "web_api",
    "infrastructure",
    "application",
    "domain",
]
exhaustive = true
